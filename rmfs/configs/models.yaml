# Model registry for the 17-model grid. GENERATED from committed
# prior-campaign results (results/budget/*/budget.json dip_layer;
# grid metrics argmin where no budget primary exists) — never from
# recollection. Regenerate rather than hand-edit numbers.
#
# dip_layer: the LFS-VC dip under the frozen layer rule (prereg §2),
#   computed once on the n=300 development protocol.
# precision: inference dtype policy. Pooling/statistics are ALWAYS
#   fp32 regardless (CLAUDE.md rule 5).
# campaign_dump: whether an n=1500 embedding dump exists cluster-side.

defaults:
  pooling_accumulation: fp32
  inference_precision: fp16   # RTX 2080 Ti default; bf16 on A100

models:
  EuroLLM-1.7B:
    hf_id: utter-project/EuroLLM-1.7B
    n_layers: 24
    dip_layer: 14
    dip_source: budget_primary
    campaign_dump: true
